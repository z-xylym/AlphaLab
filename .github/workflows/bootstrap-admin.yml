name: Initialize first administrator

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DIAGNOSE for read-only checks, or INITIALIZE to check then initialize'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alphalab-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && (inputs.confirmation == 'INITIALIZE' || inputs.confirmation == 'DIAGNOSE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (without production secrets)
        run: python -m pip install -r requirements.txt
      - name: Diagnose database connection (read only)
        timeout-minutes: 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: python -m scripts.diagnose_database --explicit-ca
      - name: Check existing schema and initialize administrator
        if: inputs.confirmation == 'INITIALIZE'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.bootstrap_with_ca
